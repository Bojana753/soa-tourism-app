server.port=8084
spring.application.name=tour-service

spring.datasource.url=jdbc:postgresql://tour-db:5432/tourdb
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

grpc.server.port=9090
purchase.service.base-url=${PURCHASE_SERVICE_URL:http://purchase-service:8085}
grpc.server.address=0.0.0.0

# OpenTelemetry Configuration
otel.sdk.enabled=true
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
otel.traces.exporter=otlp
otel.metrics.exporter=prometheus
otel.service.name=tour-service

# Actuator for Prometheus metrics
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true
