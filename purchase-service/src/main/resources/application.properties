spring.application.name=purchase-service
server.port=8085

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/purchasedb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

tour.service.url=${TOUR_SERVICE_URL:http://tour-service:8084}

# OpenTelemetry Configuration
otel.sdk.enabled=true
otel.exporter.otlp.endpoint=${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318}
otel.traces.exporter=otlp
otel.metrics.exporter=prometheus
otel.service.name=purchase-service

# Actuator for Prometheus metrics
management.endpoints.web.exposure.include=prometheus,health,info
management.metrics.export.prometheus.enabled=true
management.endpoint.health.show-details=always
management.health.livenessState.enabled=true
management.health.readinessState.enabled=true