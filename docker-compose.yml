services:
  stakeholders-service:
    build: ./stakeholders-service
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=stakeholders-db
    depends_on:
      stakeholders-db:
        condition: service_healthy

  stakeholders-db:
    image: postgres:15
    environment:
      POSTGRES_DB: stakeholders
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5433:5432"
    volumes:
      - stakeholders_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  blog-mongodb:
    image: mongo:7
    ports:
      - "27018:27017"
    volumes:
      - blog_mongo_data:/data/db

  blog-service:
    build: ./blog-service
    ports:
      - "8082:8082"
    environment:
      MONGODB_URI: mongodb://blog-mongodb:27017/blogdb
      FOLLOWER_SERVICE_URL: http://follower-service:8083
    depends_on:
      - blog-mongodb
      - follower-service

  follower-neo4j:
    image: neo4j:5-community
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/password123
    volumes:
      - follower_neo4j_data:/data
      - follower_neo4j_logs:/logs

  follower-service:
    build: ./follower-service
    ports:
      - "8083:8083"
    environment:
      PORT: 8083
      NEO4J_URL: http://follower-neo4j:7474
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password123
      NEO4J_DATABASE: neo4j
      BLOG_SERVICE_URL: http://blog-service:8082
      JWT_SECRET: super-secret-key-123
    depends_on:
      - follower-neo4j

  tour-service:
    build: ./tour-service
    ports:
      - "8084:8084"
      - "9090:9090"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://tour-db:5432/tourdb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - PURCHASE_SERVICE_URL=http://purchase-service:8085
    depends_on:
      tour-db:
        condition: service_healthy

  tour-db:
    image: postgres:15
    environment:
      POSTGRES_DB: tourdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - tour_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  purchase-service:
    build: ./purchase-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://purchase-db:5432/purchasedb
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - TOUR_SERVICE_URL=http://tour-service:8084
    depends_on:
      purchase-db:
        condition: service_healthy
      tour-service:
        condition: service_started

  purchase-db:
    image: postgres:15
    environment:
      POSTGRES_DB: purchasedb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"
    volumes:
      - purchase_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend/tourism-app
    ports:
      - "4200:80"
    depends_on:
      - stakeholders-service
      - blog-service
      - api-gateway

  api-gateway:
    build: ./api-gateway
    ports:
      - "8080:8080"
    environment:
      - EXECUTION_GRPC_ADDRESS=tour-service:9090
    depends_on:
      - stakeholders-service
      - blog-service
      - follower-service
      - tour-service
      - purchase-service

  loki:
    image: grafana/loki:2.9.8
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yml
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yml:ro
      - loki_data:/loki

  promtail:
    image: grafana/promtail:2.9.8
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    ports:
      - "8086:8080"
    privileged: true
    devices:
      - /dev/kmsg:/dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro

  prometheus:
    image: prom/prometheus:v2.52.0
    ports:
      - "9091:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:10.4.3
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - loki
      - prometheus

volumes:
  blog_mongo_data:
  follower_neo4j_data:
  follower_neo4j_logs:
  stakeholders_pg_data:
  tour_pg_data:
  purchase_pg_data:
  loki_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: soa-network
