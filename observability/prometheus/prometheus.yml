global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: cadvisor
    static_configs:
      - targets:
          - cadvisor:8080

  - job_name: node-exporter
    static_configs:
      - targets:
          - node-exporter:9100

  - job_name: stakeholders-service
    static_configs:
      - targets:
          - stakeholders-service:8889

  - job_name: follower-service
    static_configs:
      - targets:
          - follower-service:8888

  - job_name: api-gateway
    static_configs:
      - targets:
          - api-gateway:8888

  - job_name: blog-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - blog-service:8082

  - job_name: tour-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - tour-service:8084

  - job_name: purchase-service
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - purchase-service:8085