<div class="notif-page">
  <header class="notif-hero">
    <p class="eyebrow">Traavellio</p>
    <h1>Notifications</h1>
    <p class="sub">Stay up to date with your activity</p>
  </header>

  <div class="notif-container">
    <div class="notif-toolbar">
      <button class="btn-ghost" (click)="load()">Refresh</button>
    </div>

    <p class="msg error" *ngIf="errorMessage">{{ errorMessage }}</p>

    <div class="notif-list" *ngIf="!isLoading">
      <div
        class="notif-item"
        *ngFor="let n of notifications"
        [class.unread]="!n.read"
        (click)="markRead(n)"
      >
        <span class="dot" [class.on]="!n.read"></span>
        <div class="body">
          <p class="text">{{ n.message }}</p>
          <p class="meta">{{ n.createdAt | date: 'short' }} &middot; {{ n.read ? 'read' : 'new' }}</p>
        </div>
      </div>

      <p class="empty" *ngIf="notifications.length === 0">
        You have no notifications yet.
      </p>
    </div>

    <p class="loading" *ngIf="isLoading">Loading...</p>
  </div>
</div>
